[workspace]
resolver = "2"
members = [
    "crates/hap-tlv8",
    "crates/hap-crypto",
    "crates/hap-transport",
    "crates/hap-pairing",
    "crates/hap-model",
    "crates/hap-controller",
    "crates/hap-ble",
    "crates/hap-thread",
    "crates/hap-thread-dut",
    "xtask",
]

# Shared metadata picked up by each crate via `field.workspace = true`.
# The crate `version` is intentionally NOT shared — every crate is versioned
# independently and bumps on its own milestone cadence (see README).
[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/phunapps/hap-rust"
homepage = "https://github.com/phunapps/hap-rust"
authors = ["hap-rust contributors"]
keywords = ["homekit", "hap", "smart-home", "iot", "accessory"]
categories = ["network-programming", "api-bindings", "cryptography"]

# Lints enforced workspace-wide. Each crate opts in with `[lints] workspace = true`.
# CI runs clippy with `-D warnings`, so any of these becoming a warning fails the build.
# `unsafe_code = "forbid"` is set here AND repeated as `#![forbid(unsafe_code)]` at
# every crate root — the inner attribute is what shows up in published rustdoc and
# survives someone copying a single crate out of the workspace.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
undocumented_unsafe_blocks = "warn"
# General hygiene.
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that produce too much noise for a library at this stage.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_const_for_fn = "allow"
# "HomeKit" is a product name in our docs, not code — don't force backticks.
doc_markdown = "allow"
# `assert!(x.is_empty())` reads better than the suggested
# `assert_eq!(x, [] as [T; 0])`, and it is only used in tests.
assert_is_empty = "allow"

# Common dependency versions, so every member crate pulls the same release.
# Add to this table — do not bump per-crate without discussion. Crypto-primitive
# crates (ring / RustCrypto / a bigint crate) are deliberately NOT pinned here
# yet; they land with hap-crypto in M2 once the exact provider is chosen.
[workspace.dependencies]
thiserror = "2"
bitflags = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# base64 for the opaque `tlv8` / `data` characteristic value formats (hap-model M6).
# No default features: they add `simd-unsafe` engines (unsafe SIMD code) we
# never call, since we use the scalar `general_purpose` engine.
base64 = { version = "0.23", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false }
# Channel→Stream adapter for the controller's events() API (hap-controller M7).
# tokio-stream re-exports futures_core::Stream and provides BroadcastStream, so
# the public async Stream needs no separate `futures` dependency.
tokio-stream = { version = "0.1", default-features = false }
# Structured, zero-cost-when-disabled diagnostics (hap-ble advert/sleepy path).
# No-op unless the consumer installs a `tracing` subscriber.
tracing = { version = "0.1", default-features = false, features = ["std"] }
# A subscriber so the reference accessory bin and examples can print `tracing`
# diagnostics. Not a library dependency.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "env-filter",
] }
# Crypto primitives for hap-crypto (M2). SRP-6a modular exponentiation uses
# num-bigint's dynamic-width integers; sha2 provides SHA-512; subtle gives
# constant-time comparison of secret proofs. Primitives are never reimplemented.
num-bigint = "0.5"
num-traits = "0.2"
sha2 = "0.11"
subtle = "2"
# HKDF-SHA512 key derivation (RustCrypto, over sha2::Sha512).
hkdf = "0.13"
# ChaCha20-Poly1305 AEAD, IETF 96-bit-nonce construction (RustCrypto).
# `zeroize` (off by default since 0.11) wipes the cipher's key copy, the
# per-message Poly1305 key and the ChaCha20 state on drop.
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
# Ed25519 controller long-term keypair (dalek); the rand_core feature enables
# SigningKey::generate.
ed25519-dalek = { version = "3", features = ["rand_core"] }
# X25519 ephemeral ECDH for Pair Verify (M3, dalek). `static_secrets` enables
# constructing a secret from raw 32-byte material (deterministic replay/tests);
# `getrandom` lets `StaticSecret::random` draw from the OS CSPRNG.
x25519-dalek = { version = "3", features = ["static_secrets", "getrandom"] }
# OS CSPRNG for the Ed25519 keypair and the SRP-6a salt and private values:
# getrandom's SysRng, behind rand_core's RNG traits (UnwrapErr makes it
# infallible, panicking only if the OS source fails).
rand_core = "0.10"
getrandom = { version = "0.4", features = ["sys_rng"] }
# Testing / automation.
proptest = "1"
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
toml = "1" # hap-tlv8 test-vector manifest; xtask lockfile parsing (fuzz-lock)
# mDNS service discovery for _hap._tcp (hap-transport M4) and _hap._udp
# (hap-thread / Thread-CoAP).
mdns-sd = "0.21"
# CoAP message codec (sans-I/O: encode/decode only; hap-thread owns the UDP
# socket via tokio). Isolated behind the crate's CoapTransport trait so the
# choice is swappable. See hap-thread design decision D1.
coap-lite = "0.13"
# Dev-only: RFC 5054 known-answer test uses SHA-1 and hex fixtures. `sha1` is
# the renamed successor of the `sha-1` crate (same RustCrypto project).
sha1 = "0.11"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
# Raw ChaCha20 + Poly1305 for the BLE broadcast cipher's 4-byte tag.
# `zeroize` wipes the ChaCha20 state (the broadcast key) and the Poly1305
# state (also the AEAD's, through feature unification) on drop.
chacha20 = { version = "0.10", features = ["zeroize"] }
poly1305 = { version = "0.9", features = ["zeroize"] }
# Not used in code: depended on only to turn on its `zeroize` feature, which
# wipes the keystream buffer of every ChaCha20 instance (chacha20poly1305's
# and ours) on drop. That buffer can hold the Poly1305 one-time key, and
# neither chacha20 nor chacha20poly1305 forwards the feature.
cipher = { version = "0.5", default-features = false, features = ["zeroize"] }

# Release profile defaults. Keep these conservative; consumers can override.
[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
