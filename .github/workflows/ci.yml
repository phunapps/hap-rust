name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The `ble` feature (via --all-features) pulls the Linux `bluer` stack,
      # which needs libdbus at build time.
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The `ble` feature (via --all-features) needs libdbus on Linux.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo test --workspace --all-features --locked --no-fail-fast

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo build --workspace --all-features --locked

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo doc --workspace --all-features --locked --no-deps

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  fuzz-lock:
    name: fuzz lockfiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The check builds the fuzz workspaces into target/fuzz-lock. List them,
      # or the cache drops the fuzz-only crates (libFuzzer's C++ build) as
      # foreign to the root workspace and every run rebuilds them.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/hap-tlv8/fuzz -> ../../../target/fuzz-lock
            crates/hap-model/fuzz -> ../../../target/fuzz-lock
      # The fuzz crates are standalone workspaces with their own Cargo.lock.
      # Fails if one drifted from the root lockfile, no longer compiles, or is
      # missing from a workflow matrix. Fix drift locally with
      # `cargo xtask fuzz-lock --sync`.
      - run: cargo run --locked --quiet --package xtask -- fuzz-lock

  fuzz-deps:
    name: fuzz deps (${{ matrix.crate }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # One entry per fuzz workspace; `cargo xtask fuzz-lock` checks the list.
        include:
          - crate: hap-tlv8
          - crate: hap-model
    steps:
      - uses: actions/checkout@v4
      # The fuzz crates have their own Cargo.lock, which the root audit and
      # deny jobs never read. `cargo deny` finds the root deny.toml by walking
      # up from the manifest.
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: crates/${{ matrix.crate }}/fuzz
      - if: ${{ !cancelled() }}
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: crates/${{ matrix.crate }}/fuzz/Cargo.toml
