[package]
name = "hap-pairing"
version = "0.0.0"
description = "HomeKit Accessory Protocol Pair Setup / Pair Verify orchestration, pairings management, and persistence."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["homekit", "hap", "pairing", "iot"]
categories = ["network-programming", "authentication"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
hap-tlv8 = { path = "../hap-tlv8", version = "0.0.0" }
hap-crypto = { path = "../hap-crypto", version = "0.0.0" }
hap-transport = { path = "../hap-transport", version = "0.0.0" }
tokio = { workspace = true, features = ["rt", "macros", "fs"] }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "rt-multi-thread", "fs"] }
tempfile = "3"

[[example]]
name = "pair_accessory"
