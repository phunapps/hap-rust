[package]
name = "hap-controller"
version = "1.2.0"
description = "High-level HomeKit (HAP) controller API: discover, pair, connect, read/write/subscribe characteristics."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["homekit", "hap", "controller", "smart-home", "iot"]
categories = ["network-programming", "api-bindings", "asynchronous"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
hap-tlv8 = { path = "../hap-tlv8", version = "1.0.0" }
hap-crypto = { path = "../hap-crypto", version = "1.0.0" }
hap-transport = { path = "../hap-transport", version = "1.0.0" }
hap-pairing = { path = "../hap-pairing", version = "2.0.0" }
hap-model = { path = "../hap-model", version = "1.2.0" }
hap-ble = { path = "../hap-ble", version = "0.3.0", optional = true }
tokio = { workspace = true, features = ["sync", "rt", "macros", "time"] }
tokio-stream = { workspace = true, features = ["sync"] }
async-trait = { workspace = true }
thiserror = { workspace = true }

[features]
ble = ["dep:hap-ble"]

[dev-dependencies]
hap-ble = { path = "../hap-ble", version = "0.3.0", features = ["test-support"] }
# Integration tests are a separate crate: they only see hap-controller's public
# API plus these dev-deps, so the lower types the test doubles name (the
# AccessoryPairing inside StoredAccessory, the PairingStore Result alias) must be
# listed here even though the library already depends on them.
hap-crypto = { path = "../hap-crypto", version = "1.0.0" }
hap-pairing = { path = "../hap-pairing", version = "2.0.0" }
hap-transport = { path = "../hap-transport", version = "1.0.0" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tokio-stream = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
