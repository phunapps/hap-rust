[package]
name = "hap-tlv8-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.hap-tlv8]
path = ".."

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[workspace]
# Standalone workspace so the fuzz crate is excluded from the main workspace
# build and lints (it depends on nightly-only libfuzzer machinery).
