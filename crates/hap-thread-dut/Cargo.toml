[package]
name = "hap-thread-dut"
version = "0.2.0"
description = "A HomeKit-over-Thread (CoAP) reference accessory / device-under-test, for exercising HAP-over-Thread controllers such as hap-thread."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["homekit", "hap", "thread", "coap", "testing"]
categories = ["network-programming", "development-tools::testing"]
readme = "README.md"

[lints]
workspace = true

[[bin]]
name = "hap-thread-dut"
path = "src/main.rs"

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }
coap-lite = { workspace = true }
tracing-subscriber = { workspace = true }
hap-tlv8 = { path = "../hap-tlv8", version = "1.0.0" }
hap-crypto = { path = "../hap-crypto", version = "1.4.0" }
# HKDF-SHA512 for the accessory-side session-key derivation (RFC 5869; matches
# hap-crypto's controller-side derivation byte-for-byte).
hkdf = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "macros", "time", "test-util"] }
hap-thread = { path = "../hap-thread", version = "0.3.0" }
