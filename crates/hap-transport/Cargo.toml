[package]
name = "hap-transport"
version = "1.3.0"
description = "HomeKit Accessory Protocol IP transport: mDNS discovery, HAP HTTP/1.1, and the ChaCha20-Poly1305 record layer."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords = ["homekit", "hap", "mdns", "transport", "iot"]
categories = ["network-programming", "asynchronous"]
readme = "README.md"

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "macros", "time"] }
mdns-sd = { workspace = true }
hap-tlv8 = { path = "../hap-tlv8", version = "1.0.0" }
hap-crypto = { path = "../hap-crypto", version = "1.0.0" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "io-util", "sync", "macros", "time", "test-util"] }
serde = { workspace = true }
serde_json = { workspace = true }
